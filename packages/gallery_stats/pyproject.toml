[build-system]
requires = ["setuptools>=74", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gallery-stats"
version = "0.1.0"
description = "Deterministic stats engine for Gallery (PitchSim event stream)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "King Emmanuel" }]
dependencies = [
  "gallery-schema>=0.1.0",
  "pydantic>=2.7,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

