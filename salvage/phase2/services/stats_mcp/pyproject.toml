[build-system]
requires = ["setuptools>=74", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stats-mcp"
version = "0.1.0"
description = "MCP server exposing Gallery deterministic stats tools."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "King Emmanuel" }]
dependencies = [
  "mcp>=1.24.0,<2",
  "gallery-schema>=0.1.0",
  "gallery-stats>=0.1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

