[build-system]
requires = ["setuptools>=74", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "playmakers-agents"
version = "0.1.0"
description = "Placeholder agent package layout for Playmakers (no LLM calls in Phase 1)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "King Emmanuel" }]
dependencies = [
  "playmakers-schema>=0.1.0",
  "playmakers-stats>=0.1.0",
  "pitchsim>=0.1.0",
  "agent-framework-core==1.21.0",
  "openai>=1.40.0,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

