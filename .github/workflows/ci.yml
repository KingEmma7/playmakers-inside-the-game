name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tooling + packages
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e packages/playmakers_schema
          python -m pip install -e packages/pitchsim
          python -m pip install -e packages/playmakers_stats
          python -m pip install -e services/stats_mcp
          python -m pip install -e packages/playmakers_agents
          python -m pip install -e services/replay_api
          python -m pip check

      - name: Lint (ruff)
        run: |
          ruff format --check .
          ruff check .

      - name: Tests (pytest)
        run: pytest

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Install Chromium
        run: cd web && npx playwright install --with-deps chromium
      - name: Live browser integration
        run: scripts/verify.sh
      - name: Upload browser captures and server logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence
          path: |
            artifacts/verify/


  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run types:generate
      - name: Verify generated contracts are current
        run: git diff --exit-code -- src/generated
      - run: npm run lint
      - run: npm test
      - run: npm run build
