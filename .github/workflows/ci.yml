name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling + packages
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e packages/playmakers_schema
          python -m pip install -e packages/pitchsim
          python -m pip install -e packages/playmakers_stats
          python -m pip install -e services/stats_mcp
          python -m pip install -e packages/playmakers_agents
          python -m pip install -e services/replay_api
          python -m pip check

      - name: Lint (ruff)
        run: |
          ruff format --check .
          ruff check .

      - name: Tests (pytest)
        run: pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Install Chromium
        run: cd web && npx playwright install --with-deps chromium
      - name: Live browser integration
        run: |
          uvicorn replay_api.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          API_PID=$!
          npm run dev --prefix web -- --port 5173 --strictPort > /tmp/web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$API_PID" "$WEB_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/healthz && curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          npm run screenshot --prefix web
      - name: Upload browser captures and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            web/shots/*.png
            web/e2e-screenshot.png
            /tmp/api.log
            /tmp/web.log


  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run types:generate
      - name: Verify generated contracts are current
        run: git diff --exit-code -- src/generated
      - run: npm run lint
      - run: npm test
      - run: npm run build
