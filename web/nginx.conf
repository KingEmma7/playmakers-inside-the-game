server {
    listen 80;
    root /usr/share/nginx/html;
    # 40-config.sh writes the /api/ proxy here only when API_UPSTREAM is set, so the
    # image also starts where no "api" host exists (for example Azure Container Apps).
    include /etc/nginx/playmakers/*.conf;
    location / { try_files $uri $uri/ /index.html; }
}
