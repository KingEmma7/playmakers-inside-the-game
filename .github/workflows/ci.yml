name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling + packages
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e packages/gallery_schema
          python -m pip install -e packages/pitchsim
          python -m pip install -e packages/gallery_stats
          python -m pip install -e services/stats_mcp
          python -m pip install -e packages/gallery_agents
          python -m pip install -e services/replay_api
          python -m pip check

      - name: Lint (ruff)
        run: |
          ruff format --check .
          ruff check .

      - name: Tests (pytest)
        run: pytest


  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run types:generate
      - name: Verify generated contracts are current
        run: git diff --exit-code -- src/generated
      - run: npm run lint
      - run: npm test
      - run: npm run build
