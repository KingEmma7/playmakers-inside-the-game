[build-system]
requires = ["setuptools>=74", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "playmakers-agents"
version = "0.1.0"
description = "Typed broadcast agents on Microsoft Agent Framework with offline model clients."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "King Emmanuel" }]
dependencies = [
  "playmakers-schema>=0.1.0",
  "playmakers-stats>=0.1.0",
  "pitchsim>=0.1.0",
  "agent-framework-core==1.21.0",
  "agent-framework-openai==1.16.0",
  "agent-framework-foundry==1.14.1",
  "mcp>=1.24,<2",
  "azure-identity>=1.25,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

